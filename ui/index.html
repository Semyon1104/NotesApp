<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f1e9" />
  <title>Pisa-nina</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z"/><path d="M12 10v5M9.5 12.5h5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6a2.5 2.5 0 0 1 2.5 2.5v7A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9 3.5h6M7 7l.8 12.5h8.4L17 7M10 11v5M14 11v5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m4 16.7-.5 3.8 3.8-.5L19 8.3 15.7 5zM13.8 6.9l3.3 3.3"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3.5h11l3 3V20H5z"/><path d="M8 3.5v5h7v-5M8 20v-6h8v6"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3.5 11 8.5-8 8.5 8M6 9.5V20h12V9.5M9.5 20v-6h5v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.3 4.3L19 7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.4"/><path d="m4.5 17 4.7-4.5 3.2 3 2.8-2.7 4.3 4.2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-number-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h1v4M3 10h2M3.5 14.5c.5-.7 1.7-.6 1.7.4 0 .5-.5.9-1.7 2.1h2M3.4 19.2c.5-.5 1.6-.4 1.6.5 0 .4-.3.6-.8.7.6.1 1 .4 1 .9 0 .9-1.2 1.1-1.8.4"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19.5 4.5C12 4.2 6.5 7.7 5 13.7c-.8 3.2 1.2 5.2 4 5.3 6.1.1 9.8-5.2 10.5-14.5Z"/><path d="M4 21c2.2-5.4 5.7-8.6 10.5-11"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5c.5 4.4 2.1 6 6.5 6.5-4.4.5-6 2.1-6.5 6.5-.5-4.4-2.1-6-6.5-6.5 4.4-.5 6-2.1 6.5-6.5Z"/><path d="M18.5 16.5c.2 1.8.9 2.5 2.7 2.7-1.8.2-2.5.9-2.7 2.7-.2-1.8-.9-2.5-2.7-2.7 1.8-.2 2.5-.9 2.7-2.7Z"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 5.5V12l7.5 7.5 8-8L12 4H5.5A1.5 1.5 0 0 0 4 5.5Z"/><circle cx="8" cy="8" r="1.25"/></symbol>
    <symbol id="i-panel-left" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9 4.5v15M14.5 9.5 12 12l2.5 2.5"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" id="brandButton" type="button" aria-label="К заметкам">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 44 44"><rect width="44" height="44" rx="14" fill="currentColor"/><path d="M30.5 12.6c-9.3-.4-15.3 3.7-17 10.5-.9 3.6 1.2 6.2 4.6 6.3 7.4.1 12-6.1 12.4-16.8Z" fill="#f7f4ec"/><path d="M12.2 34.2c2.2-6.9 6.4-11.3 12.6-14.1" fill="none" stroke="#f7f4ec" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-copy">
          <span class="brand-name"><span>Pisa-</span><span>nina</span></span>
        </span>
      </button>
      <nav class="main-nav" aria-label="Основная навигация">
        <div class="nav-home-row">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" title="Скрыть панель" aria-label="Скрыть панель" aria-expanded="true">
            <svg><use href="#i-panel-left"></use></svg>
          </button>
          <button class="nav-item" id="rootButton" type="button">
            <span class="nav-icon"><svg><use href="#i-home"></use></svg></span>
            <span>Заметки</span>
            <span class="nav-count" id="rootCount">0</span>
          </button>
        </div>
      </nav>

      <section class="folder-section" aria-labelledby="foldersLabel">
        <div class="section-label" id="foldersLabel">Папки</div>
        <div class="folder-tree" id="folderTree"></div>
      </section>

      <div class="sidebar-bottom">
        <section class="shortcut-panel" aria-labelledby="shortcutTitle">
          <div class="shortcut-title" id="shortcutTitle">Горячие клавиши</div>
          <div class="shortcut-row"><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>N</kbd></span><span>новая заметка</span></div>
          <div class="shortcut-row"><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>N</kbd></span><span>новая папка</span></div>
          <div class="shortcut-row"><span class="shortcut-keys"><kbd>Ctrl</kbd><kbd>S</kbd></span><span>сохранить</span></div>
          <div class="shortcut-row"><span class="shortcut-keys"><kbd>Delete</kbd></span><span>удалить выбранное</span></div>
          <div class="shortcut-row"><span class="shortcut-keys"><kbd>Esc</kbd></span><span>закрыть заметку</span></div>
          <div class="shortcut-row"><span class="shortcut-keys"><kbd>Alt</kbd><span class="shortcut-plus">+</span><span class="shortcut-drag">перетаскивание</span></span><span>копия</span></div>
        </section>
      </div>

    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="icon-btn sidebar-reveal" id="sidebarShowButton" type="button" title="Показать панель" aria-label="Показать панель" aria-expanded="false">
          <svg><use href="#i-panel-left"></use></svg>
        </button>
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Путь"></nav>
        <div class="top-actions">
          <button class="btn btn-primary" id="newNoteButton" type="button" title="Новая заметка">
            <svg><use href="#i-plus"></use></svg><span class="btn-label">Заметка</span>
          </button>
          <button class="btn" id="newFolderButton" type="button" title="Новая папка">
            <svg><use href="#i-folder-plus"></use></svg><span class="btn-label">Папка</span>
          </button>
          <button class="btn" id="folderBackgroundButton" type="button" title="Фон папки" hidden>
            <svg><use href="#i-image"></use></svg><span class="btn-label">Фон</span>
          </button>
          <button class="icon-btn" id="clearFolderBackgroundButton" type="button" title="Убрать фон папки" aria-label="Убрать фон папки" hidden>
            <svg><use href="#i-x"></use></svg>
          </button>
          <button class="btn btn-delete" id="deleteButton" type="button" disabled title="Удалить выбранное">
            <svg><use href="#i-trash"></use></svg><span class="btn-label">Удалить</span><span class="selection-count" id="selectionCount"></span>
          </button>
        </div>
        <section class="category-bar" id="categoryBar" aria-labelledby="categoriesLabel">
          <span class="category-label" id="categoriesLabel">Категории</span>
          <div class="category-list" id="categoryList"></div>
          <button class="category-add" id="newCategoryButton" type="button" title="Создать категорию">
            <svg><use href="#i-plus"></use></svg><span>Категория</span>
          </button>
          <button class="category-toggle" id="categoryToggleButton" type="button" title="Скрыть категории" aria-label="Скрыть категории" aria-expanded="true">
            <svg><use href="#i-chevron"></use></svg><span id="categoryToggleText">Скрыть</span>
          </button>
        </section>
      </header>

      <section class="canvas" id="canvas" aria-live="polite">
        <div class="canvas-inner">
          <div class="grid" id="grid"></div>
          <div class="empty-state" id="emptyState" hidden>
            <div class="empty-art" aria-hidden="true">
              <div class="paper-sheet paper-back"></div>
              <div class="paper-sheet paper-front">
                <span class="paper-line long"></span>
                <span class="paper-line"></span>
                <span class="paper-line short"></span>
                <span class="paper-leaf"><svg><use href="#i-leaf"></use></svg></span>
              </div>
              <span class="art-dot dot-one"></span>
              <span class="art-dot dot-two"></span>
            </div>
            <div class="empty-actions">
              <button class="btn btn-primary" id="emptyNewNote" type="button"><svg><use href="#i-plus"></use></svg>Новая заметка</button>
              <button class="btn" id="emptyNewFolder" type="button"><svg><use href="#i-folder-plus"></use></svg>Новая папка</button>
            </div>
          </div>
          <input type="file" id="folderBackgroundInput" accept="image/*" hidden />
        </div>
      </section>
    </main>
  </div>

  <div class="loading-screen" id="loadingScreen">
    <span class="loading-mark"><svg><use href="#i-leaf"></use></svg></span>
    <span>открываем Pisa-nina…</span>
  </div>

  <div class="overlay" id="noteOverlay" aria-hidden="true">
    <div class="overlay-backdrop" data-close-note="true"></div>
    <article class="note-panel" role="dialog" aria-modal="true" aria-labelledby="noteTitleInput">
      <header class="note-topbar">
        <div class="note-context">
          <span class="note-place" id="notePlace"></span>
          <span class="note-date" id="noteDate"></span>
        </div>
        <div class="note-controls">
          <button class="icon-btn save" id="saveNoteButton" type="button" title="Сохранить (Ctrl+S)" aria-label="Сохранить заметку" disabled>
            <svg><use href="#i-save"></use></svg>
          </button>
          <button class="icon-btn" id="voiceButton" type="button" title="Голосовой ввод" aria-label="Голосовой ввод">
            <svg><use href="#i-mic"></use></svg>
          </button>
          <button class="icon-btn danger" id="deleteNoteButton" type="button" title="Удалить заметку" aria-label="Удалить заметку">
            <svg><use href="#i-trash"></use></svg>
          </button>
          <span class="control-divider"></span>
          <button class="icon-btn close" id="closeNoteButton" type="button" title="Закрыть" aria-label="Закрыть заметку">
            <svg><use href="#i-x"></use></svg>
          </button>
        </div>
      </header>

      <div class="note-scroll" id="noteScroll">
        <div class="note-view" id="noteView">
          <h1 class="note-title" id="noteViewTitle"></h1>
          <p class="note-subtitle" id="noteViewSubtitle" hidden></p>
          <div class="note-content" id="noteViewContent"></div>
        </div>
        <div class="note-editor-wrap" id="noteEditorWrap" hidden>
          <textarea class="note-title-input" id="noteTitleInput" rows="1" maxlength="120" placeholder="Название заметки"></textarea>
          <input class="note-subtitle-input" id="noteSubtitleInput" type="text" maxlength="240" placeholder="Подзаголовок" autocomplete="off" />
          <div class="note-content-editor" id="noteEditor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Содержание заметки" data-placeholder="Пишите здесь…"></div>
        </div>
      </div>

      <footer class="note-footer" id="noteFooter">
        <div class="format-bar" id="formatBar">
          <button class="format-btn" type="button" data-command="bold" title="Жирный"><b>Ж</b></button>
          <button class="format-btn" type="button" data-command="italic" title="Курсив"><i>К</i></button>
          <button class="format-btn" type="button" data-command="underline" title="Подчёркнутый"><u>Ч</u></button>
          <span class="format-divider"></span>
          <button class="format-btn" type="button" data-command="insertUnorderedList" title="Список"><svg><use href="#i-list"></use></svg></button>
          <button class="format-btn" type="button" data-command="insertOrderedList" title="Нумерованный список"><svg><use href="#i-number-list"></use></svg></button>
          <button class="format-btn" type="button" id="insertImageButton" title="Вставить картинку"><svg><use href="#i-image"></use></svg></button>
          <input type="file" id="imageFileInput" accept="image/*" multiple hidden />
        </div>
        <div class="save-state" id="saveState">
          <span class="save-dot"></span>
          <span id="saveStateText">Сохранено</span>
        </div>
      </footer>
    </article>
  </div>

  <div class="dialog-layer" id="dialogLayer" aria-hidden="true">
    <div class="dialog-backdrop" data-dialog-cancel="true"></div>
    <div class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <button class="dialog-close" id="dialogClose" type="button" aria-label="Закрыть"><svg><use href="#i-x"></use></svg></button>
      <span class="dialog-icon" id="dialogIcon"><svg><use href="#i-folder-plus"></use></svg></span>
      <h2 id="dialogTitle">Новая папка</h2>
      <p class="dialog-text" id="dialogText"></p>
      <input class="dialog-input" id="dialogInput" type="text" maxlength="120" autocomplete="off" />
      <div class="dialog-actions">
        <button class="btn" id="dialogCancel" type="button">Отмена</button>
        <button class="btn btn-primary" id="dialogConfirm" type="button">Создать</button>
      </div>
    </div>
  </div>

  <div class="image-resize-toolbar" id="imageResizeToolbar" hidden>
    <button class="image-size-step" id="imageNarrowerButton" type="button" aria-label="Уменьшить изображение">−</button>
    <span class="image-size-label" id="imageSizeLabel">100%</span>
    <button class="image-size-step" id="imageWiderButton" type="button" aria-label="Увеличить изображение">+</button>
    <span class="image-size-divider"></span>
    <button class="image-reset-button" id="imageResetButton" type="button">Сбросить</button>
  </div>
  <div class="image-resize-handle" id="imageResizeHandle" hidden aria-hidden="true"></div>

  <div class="toast" id="toast" role="status"></div>
  <div class="voice-toast" id="voiceToast" role="status" aria-live="assertive">
    <span class="voice-orb"><svg><use href="#i-mic"></use></svg></span>
    <span><strong id="voiceToastTitle">Слушаю…</strong><small id="voiceToastText">говорите обычным голосом</small></span>
    <span class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
